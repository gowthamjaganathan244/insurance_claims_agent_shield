name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests (default, operations, remote monitoring)
        run: |
          npm run test:e2e
          AGENTSHIELD_TEST_OPERATIONS=true npx playwright test tests/operations.spec.ts tests/claim-workflows.spec.ts --project=chromium --project=mobile
          AGENTSHIELD_TEST_REMOTE_MONITORING=true npx playwright test tests/remote-monitoring.spec.ts --project=chromium --project=mobile
          AGENTSHIELD_TEST_REDIS=true npx playwright test tests/authentication.spec.ts tests/api-contract.spec.ts --project=chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
  lambdas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        api: [claims-api, operations-api, monitoring-api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install boto3
      - run: python -m unittest discover -s tests -v
        working-directory: backend/${{ matrix.api }}
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install boto3 "moto[dynamodb,s3,cloudwatch]"
      - name: Real Lambda handlers against simulated AWS (synthetic data)
        run: python -m unittest -v test_integration
        working-directory: backend/integration-tests
      - name: Deployed malware processor against simulated AWS
        run: python -m unittest discover -s tests -v
        working-directory: backend/malware-processor
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Template is reproducible from its generator
        run: |
          cp backend/staging/template.json /tmp/committed.json
          python backend/staging/build_template.py
          diff -u /tmp/committed.json backend/staging/template.json
      - run: pip install cfn-lint && cfn-lint backend/staging/template.json --regions ap-southeast-2
